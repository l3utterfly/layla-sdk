name: Publish Package

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # must be a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check if this version is already published
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@layla-network/sdk@$LOCAL_VERSION" version 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "Version $LOCAL_VERSION is not on npm — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $LOCAL_VERSION already on npm — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public